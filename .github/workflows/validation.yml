name: Validation

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  formatting:
    name: AlteKamerer / formatting and lint
    runs-on: ubuntu-latest

    container:
      image: ghcr.io/ubk8751/flutter-android-ci@sha256:00e8703d227d3cccbd927c327f652df4f76f867e1d18562def11ba327f164b00
    steps:
      - uses: actions/checkout@v6

      - name: Resolve Flutter dependencies
        run: flutter pub get

      - name: Check Dart formatting
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Analyze Dart
        run: flutter analyze

  tests:
    name: AlteKamerer / tests and debug APK
    runs-on: ubuntu-latest

    container:
      image: ghcr.io/ubk8751/flutter-android-ci@sha256:00e8703d227d3cccbd927c327f652df4f76f867e1d18562def11ba327f164b00
    steps:
      - uses: actions/checkout@v6

      - name: Resolve Flutter dependencies
        run: flutter pub get

      - name: Run Flutter tests
        run: flutter test --reporter compact

      - name: Build debug APK
        run: flutter build apk --debug

      - name: Verify debug APK
        run: test -s build/app/outputs/flutter-apk/app-debug.apk

  required:
    name: AlteKamerer / required
    needs: [formatting, tests]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require successful checks
        env:
          FORMATTING_RESULT: ${{ needs.formatting.result }}
          TEST_RESULT: ${{ needs.tests.result }}
        run: |
          printf 'Formatting: %s\nTests: %s\n' "$FORMATTING_RESULT" "$TEST_RESULT"
          test "$FORMATTING_RESULT" = success
          test "$TEST_RESULT" = success

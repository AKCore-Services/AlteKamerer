name: Validation

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  ANDROID_HOME: /srv/ci/tools/android-sdk
  ANDROID_SDK_ROOT: /srv/ci/tools/android-sdk
  MISE_AUTO_INSTALL: "false"

jobs:
  formatting:
    name: AlteKamerer / formatting and lint
    runs-on: [self-hosted, Linux, X64, akcore-ci]
    steps:
      - uses: actions/checkout@v6

      - name: Activate shared toolchain
        uses: jdx/mise-action@v2
        with:
          install: false
          cache: false
          reshim: true

      - name: Resolve Flutter dependencies
        run: flutter pub get

      - name: Check Dart formatting
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Analyze Dart
        run: flutter analyze

  tests:
    name: AlteKamerer / tests and debug APK
    runs-on: [self-hosted, Linux, X64, akcore-ci]
    steps:
      - uses: actions/checkout@v6

      - name: Activate shared toolchain
        uses: jdx/mise-action@v2
        with:
          install: false
          cache: false
          reshim: true

      - name: Resolve Flutter dependencies
        run: flutter pub get

      - name: Run Flutter tests
        run: flutter test --reporter compact

      - name: Build debug APK
        run: flutter build apk --debug

      - name: Verify debug APK
        run: test -s build/app/outputs/flutter-apk/app-debug.apk

  required:
    name: AlteKamerer / required
    needs: [formatting, tests]
    if: always()
    runs-on: [self-hosted, Linux, X64, akcore-ci]
    steps:
      - name: Require successful checks
        env:
          FORMATTING_RESULT: ${{ needs.formatting.result }}
          TEST_RESULT: ${{ needs.tests.result }}
        run: |
          printf 'Formatting: %s\nTests: %s\n' "$FORMATTING_RESULT" "$TEST_RESULT"
          test "$FORMATTING_RESULT" = success
          test "$TEST_RESULT" = success

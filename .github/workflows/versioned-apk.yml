name: AlteKamerer versioned APK

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Existing release tag (e.g. altekamerer-v1.2.1)'
        required: true
        default: 'altekamerer-v1.2.1'
        type: string

permissions:
  contents: write

jobs:
  apk:
    name: Build versioned APK
    runs-on: ubuntu-latest

    container:
      image: ghcr.io/ubk8751/flutter-android-ci@sha256:00e8703d227d3cccbd927c327f652df4f76f867e1d18562def11ba327f164b00

    env:
      RELEASE_TAG: ${{ inputs.release_tag }}

    steps:
      - name: Verify release tag format
        run: |
          if ! printf '%s\n' "$RELEASE_TAG" |
            grep -Eq '^altekamerer-v[0-9]+\.[0-9]+\.[0-9]+$'
          then
            echo "Invalid release tag: $RELEASE_TAG" >&2
            exit 1
          fi

      - name: Checkout release source
        uses: actions/checkout@v6
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Verify release toolchain
        run: |
          command -v flutter
          command -v java
          command -v base64

      - name: Restore release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ALTEKAMERER_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$KEYSTORE_BASE64" \
            | base64 --decode \
            > android/altekamerer-release.jks

      - name: Configure release signing
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ALTEKAMERER_KEYSTORE_PASSWORD }}
        run: |
          cat > android/key.properties <<EOF_INNER
          storePassword=$KEYSTORE_PASSWORD
          keyPassword=$KEYSTORE_PASSWORD
          keyAlias=altekamerer
          storeFile=../altekamerer-release.jks
          EOF_INNER

      - name: Verify release version
        run: |
          TAG_VERSION="${RELEASE_TAG#altekamerer-v}"

          APP_VERSION="$(
            sed -n 's/^version:[[:space:]]*\([^+]*\).*/\1/p' \
              pubspec.yaml
          )"

          if [ "$TAG_VERSION" != "$APP_VERSION" ]; then
            echo "Tag version $TAG_VERSION does not match app version $APP_VERSION." >&2
            exit 1
          fi

      - name: Build release APK
        run: flutter build apk --release

      - name: Prepare versioned APK
        run: |
          VERSION="${RELEASE_TAG#altekamerer-v}"

          cp \
            build/app/outputs/flutter-apk/app-release.apk \
            "AlteKamerer-v${VERSION}.apk"

      - name: Upload versioned APK
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          files: AlteKamerer-v*.apk
          overwrite_files: true
          fail_on_unmatched_files: true
          make_latest: "legacy"

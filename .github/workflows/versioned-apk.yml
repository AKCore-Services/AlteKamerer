name: AlteKamerer versioned APK

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Existing release tag (e.g. altekamerer-v1.3.0)'
        required: true
        default: 'altekamerer-v1.3.0'
        type: string

permissions:
  contents: write

env:
  ANDROID_HOME: /srv/ci/tools/android-sdk
  ANDROID_SDK_ROOT: /srv/ci/tools/android-sdk
  MISE_AUTO_INSTALL: "false"

jobs:
  apk:
    name: Build versioned APK
    runs-on: [self-hosted, Linux, X64, akcore-ci]

    env:
      RELEASE_TAG: ${{ inputs.release_tag }}

    steps:
      - name: Verify release tag format
        run: |
          if ! printf '%s\n' "$RELEASE_TAG" |
            grep -Eq '^altekamerer-v[0-9]+\.[0-9]+\.[0-9]+$'
          then
            echo "Invalid release tag: $RELEASE_TAG" >&2
            exit 1
          fi

      - name: Checkout release source
        uses: actions/checkout@v6
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Activate shared toolchain
        uses: jdx/mise-action@v2
        with:
          install: false
          cache: false
          reshim: true

      - name: Verify release toolchain
        run: |
          command -v flutter
          command -v java
          command -v base64
          test -s "$ANDROID_SDK_ROOT/platforms/android-37.0/android.jar"
          test -x "$ANDROID_SDK_ROOT/build-tools/36.0.0/aapt"
          test -x "$ANDROID_SDK_ROOT/ndk/28.2.13676358/toolchains/llvm/prebuilt/linux-x86_64/bin/clang"

      - name: Restore release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ALTEKAMERER_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$KEYSTORE_BASE64" \
            | base64 --decode \
            > android/altekamerer-release.jks

      - name: Configure release signing
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ALTEKAMERER_KEYSTORE_PASSWORD }}
        run: |
          cat > android/key.properties <<EOF_INNER
          storePassword=$KEYSTORE_PASSWORD
          keyPassword=$KEYSTORE_PASSWORD
          keyAlias=altekamerer
          storeFile=../altekamerer-release.jks
          EOF_INNER

      - name: Verify release version
        run: |
          TAG_VERSION="${RELEASE_TAG#altekamerer-v}"

          APP_VERSION="$(
            sed -n 's/^version:[[:space:]]*\([^+]*\).*/\1/p' \
              pubspec.yaml
          )"

          if [ "$TAG_VERSION" != "$APP_VERSION" ]; then
            echo "Tag version $TAG_VERSION does not match app version $APP_VERSION." >&2
            exit 1
          fi

      - name: Build release APK
        run: flutter build apk --release

      - name: Prepare versioned APK
        run: |
          VERSION="${RELEASE_TAG#altekamerer-v}"

          cp \
            build/app/outputs/flutter-apk/app-release.apk \
            "AlteKamerer-v${VERSION}.apk"

      - name: Upload versioned APK
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          files: AlteKamerer-v*.apk
          overwrite_files: true
          fail_on_unmatched_files: true
          make_latest: "legacy"

      - name: Remove temporary signing files
        if: always()
        run: |
          rm -f -- android/key.properties android/altekamerer-release.jks
